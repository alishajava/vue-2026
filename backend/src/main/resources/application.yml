# 기본값: 별도 DB 서버/Docker 없이 프로젝트 폴더 안 파일 하나로 동작하는 H2.
# Postgres/Docker로 돌리고 싶으면 --spring.profiles.active=postgres 로 실행
# (docker-compose.yml은 이미 이 프로필을 쓰도록 되어 있음. application-postgres.yml 참고)
spring:
  datasource:
    url: jdbc:h2:file:./data/documentdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always # 매 시작마다 schema-h2.sql 실행(CREATE TABLE IF NOT EXISTS라 이미 있으면 그냥 넘어감)
      platform: h2 # schema-h2.sql 선택 (postgres 프로필에서는 application-postgres.yml이 postgresql로 오버라이드)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console 에서 저장된 데이터를 바로 눈으로 확인 가능 (JDBC URL: 위의 spring.datasource.url과 동일)

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true # DB의 file_name <-> 자바 필드 fileName 자동 매핑 (resultMap을 쓰고 있어 필수는 아니지만, 앞으로 매퍼가 늘어날 때를 대비해 켜둔다)

app:
  cors:
    # 로컬 vite dev server는 포트가 바뀔 수 있어서(5173, 5180 등) 패턴으로 허용한다.
    # 배포된 사이트에서도 테스트하려면 콤마로 추가: "http://localhost:*,https://alishajava.github.io"
    allowed-origin-pattern: "http://localhost:*"

server:
  port: 8080
